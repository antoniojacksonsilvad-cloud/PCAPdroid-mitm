name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    name: Build unsigned release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy requires a matching Python interpreter on the build host.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the XML rewrite rules parser
        run: python app/src/main/python/modules/rewrite_rules.py

      - name: Test the Charles rewrite parser
        run: python app/src/main/python/modules/charles_rules.py

      - name: Restore the debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # the secrets are masked by GitHub, do not print them
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          test -s "$RUNNER_TEMP/debug.keystore" || { echo "the keystore secret is empty or invalid"; exit 1; }

      - name: Assemble release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Check 16 KB alignment of native libraries
        run: .github/check_16kb_alignment.sh $(find app/build/outputs/apk -name '*.apk')

      # The release APKs are unsigned (the signing keystore is not in the
      # repo), so build the debug variants, which are signed with the fixed
      # debug keystore and can be installed on a device.
      - name: Assemble debug APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # The public certificate of the signer, to confirm that the fixed
      # keystore was really used and not the default key of the runner.
      - name: Show the signer certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in $(find app/build/outputs/apk -path '*/debug/*.apk'); do
            echo "::group::$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "DN:|SHA-256 digest" | head -4
            echo "::endgroup::"
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: PCAPdroid-mitm-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
