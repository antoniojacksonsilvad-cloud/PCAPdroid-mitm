name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    name: Build unsigned release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy requires a matching Python interpreter on the build host.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the XML rewrite rules parser
        run: python app/src/main/python/modules/rewrite_rules.py

      - name: Assemble release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Check 16 KB alignment of native libraries
        run: .github/check_16kb_alignment.sh $(find app/build/outputs/apk -name '*.apk')

      # The release APKs are unsigned (the signing keystore is not in the
      # repo), so build the debug variants, which are signed with the debug key
      # and can be installed on a device.
      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: PCAPdroid-mitm-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
