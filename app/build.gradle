plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    signingConfigs {
        release {
            storeFile file('../keystore')
            storePassword 'android'
            keyAlias 'key0'
            keyPassword 'android'
        }

        // The CI provides a fixed debug keystore through the environment, so
        // that every build is signed with the same key and can be installed
        // over the previous one. When the variables are not set (local
        // builds), the default debug key of the machine is used.
        // NOTE: the environment is read with System.getenv, environment
        // variables are not Gradle project properties, so hasProperty()
        // would never see them.
        def keystore_file = System.getenv("KEYSTORE_FILE")
        if ((keystore_file != null) && !keystore_file.isEmpty()) {
            debug {
                storeFile file( keystore_file )
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.pcapdroid.mitm"
        minSdk 24
        targetSdk 34
        versionCode 29
        versionName "2.7"

        // see productFlavors below
        /*ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }*/

        python {
            version "3.13"
            pip {
                install "../submodules/mitmproxy" // 12.2.3
                install "beautifulsoup4"
                options "--find-links", "../submodules/chaquopy-wheels"
            }
            pyc {
                src true
            }
        }
    }

    // NOTE: abi splits currently not supported by chaquopy
    // https://github.com/chaquo/chaquopy/issues/449
    // https://chaquo.com/chaquopy/doc/current/faq.html#faq-size
    flavorDimensions "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        x86_64 {
            dimension "abi"
            ndk { abiFilters "x86_64" }
        }
    }

    buildTypes {
        release {
            if (file('../keystore').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Compress native libraries in the APK. AGP 8 defaults to uncompressed,
    // page-aligned libs (extractNativeLibs="false"), which inflates standalone
    // APKs by several MB (e.g. libpython3.13.so 1.3MB -> 5.2MB). That trade-off
    // only pays off with Play Store app bundles, but we ship standalone APKs.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Disable the DEPENDENCY_INFO_BLOCK, which contains an encrypted binary blob
    // with the app dependencies, embedded by the AGP
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.pcapdroid.mitm'
}

dependencies {}
